<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
<title>Ember Launcher</title><script src="theme.js"></script><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="splash"><div class="sp"><span class="flame big"></span><b class="word"><i>E</i><i>m</i><i>b</i><i>e</i><i>r</i></b><div class="load"><u></u></div></div></div>
<div class="drag"></div>
<aside>
  <div class="brand"><span class="flame"></span><b>Ember</b></div>
  <nav>
    <button data-v="dash" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></button>
    <button data-v="lib"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Library</span></button>
    <button data-v="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
  </nav>
  <button class="theme" id="theme" title="Switch theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light mode</span></button>
  <div class="foot"><button class="ver" id="ver" title="Check for updates">v1.1</button><span><button data-l="privacy">Privacy</button> · <button data-l="terms">Terms</button></span></div>
</aside>
<main id="view"></main>
<div id="bar"></div>
<dialog id="dlg"></dialog>
<div id="upd"></div>
<div id="toast"></div>
<script src="legal.js"></script>
<script src="app.js"></script>
</body></html>
