<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
<title>Ember Launcher</title><script src="theme.js"></script><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="splash"><div class="sp"><img class="logo big" src="assets/ember-logo.png" alt=""><b class="word"><i>E</i><i>m</i><i>b</i><i>e</i><i>r</i></b><div class="load"><u></u></div></div></div>
<div class="drag"></div>
<button id="updbtn" title="A new version of Ember is available"></button>
<div class="win-ctrls" id="win-ctrls" role="group" aria-label="Window controls">
  <button class="wbtn w-min" id="win-min" title="Minimize" aria-label="Minimize">
    <svg viewBox="0 0 16 16"><path class="w-bar" d="M3 8.5h10"/><path class="w-chev" d="M6 11.2L8 13l2-1.8"/></svg>
  </button>
  <button class="wbtn w-max" id="win-max" title="Maximize" aria-label="Maximize">
    <svg class="ico-max" viewBox="0 0 16 16"><path d="M3 6V3.8c0-.44.36-.8.8-.8H6M10 3h2.2c.44 0 .8.36.8.8V6M13 10v2.2c0 .44-.36.8-.8.8H10M6 13H3.8a.8.8 0 0 1-.8-.8V10"/><rect x="4.8" y="4.8" width="6.4" height="6.4" rx="1" stroke-opacity=".45"/></svg>
    <svg class="ico-restore" viewBox="0 0 16 16"><path d="M5.5 5.5V3.8c0-.44.36-.8.8-.8h5.9c.44 0 .8.36.8.8v5.9c0 .44-.36.8-.8.8H10.5"/><rect x="3" y="5.5" width="7.5" height="7.5" rx="1.2"/></svg>
  </button>
  <button class="wbtn w-close" id="win-close" title="Close" aria-label="Close">
    <svg viewBox="0 0 16 16"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg>
  </button>
</div>
<aside>
  <div class="brand"><img class="logo" src="assets/ember-logo.png" alt=""><b>Ember</b></div>
  <nav>
    <button data-v="dash" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></button>
    <button data-v="lib"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Library</span></button>
    <button data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Statistics</span></button>
    <button data-v="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
  </nav>
  <button class="settings-btn" id="settings-btn" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Settings</span></button>
  <button class="theme" id="theme" title="Switch theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light mode</span></button>
  <div class="foot"><button class="ver" id="ver" title="Check for updates">v1.3</button><span><button data-l="privacy">Privacy</button> · <button data-l="terms">Terms</button></span></div>
</aside>
<main id="view"></main>
<div id="bar"></div>
<dialog id="dlg"></dialog>
<div id="upd"></div>
<div id="toast"></div>
<script src="legal.js"></script>
<script src="app.js"></script>
</body></html>
