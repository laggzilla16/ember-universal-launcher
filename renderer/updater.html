<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'; img-src 'self'">
<style>
@font-face { font-family: "Inter"; src: url("fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; height: 100%; background: #0d0e11; overflow: hidden; user-select: none; }
body { font: 500 14px/1.5 "Inter", system-ui, sans-serif; color: #ecebe8; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; border: 1px solid rgba(255,255,255,.08); box-sizing: border-box;
  -webkit-app-region: drag; }
body::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(135deg, #ffb454 0%, #ff7a1a 48%, #f0491f 100%); }
img { width: 56px; height: 56px; margin-bottom: 14px; }
h1 { font-size: 16px; font-weight: 650; margin: 0 0 4px; }
#detail { color: #9a9a96; font-size: 12.5px; min-height: 19px; padding: 0 28px; }
.bar { width: 280px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.09); margin: 16px 0 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; transition: width .25s ease;
  background: linear-gradient(135deg, #ffb454 0%, #ff7a1a 48%, #f0491f 100%); }
.bar.ind i { width: 40%; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
.bar.hide { visibility: hidden; }
.btns { display: none; gap: 10px; margin-top: 14px; -webkit-app-region: no-drag; }
.btns.on { display: flex; }
button { font: inherit; font-size: 13px; padding: 7px 18px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,.12);
  background: transparent; color: #ecebe8; }
button.p { border: 0; color: #1a0f05; background: linear-gradient(135deg, #ffb454 0%, #ff7a1a 100%); font-weight: 600; }
.err h1 { color: #ff8a6b; }
</style>
</head>
<body>
<img src="assets/ember-logo.png" alt="">
<h1 id="title">Preparing update...</h1>
<div id="detail"></div>
<div class="bar ind" id="bar"><i id="fill"></i></div>
<div class="btns" id="btns"><button class="p" id="retry">Try again</button><button id="close">Continue without updating</button></div>
<script>
const $ = id => document.getElementById(id);
window.updater.on(s => {
  document.body.classList.toggle('err', s.stage === 'error');
  $('title').textContent = s.title;
  $('detail').textContent = s.detail || '';
  const bar = $('bar');
  bar.classList.toggle('ind', s.percent == null && s.stage !== 'error');
  bar.classList.toggle('hide', s.stage === 'error');
  if (s.percent != null) $('fill').style.width = s.percent + '%';
  $('btns').classList.toggle('on', s.stage === 'error');
});
$('retry').onclick = () => window.updater.retry();
$('close').onclick = () => window.updater.dismiss();
</script>
</body>
</html>
