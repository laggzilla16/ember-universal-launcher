<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="glowBlue" cx="82%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#090D19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="14%" cy="92%" r="58%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#090D19" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nukronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="52%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    <linearGradient id="bluePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="52%" stop-color="#2563EB" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#E63946" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="snellRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#E63946" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Deep Midnight Background -->
  <rect width="1200" height="630" fill="#090D19" />
  <rect width="1200" height="630" fill="url(#glowBlue)" />
  <rect width="1200" height="630" fill="url(#glowRed)" />

  <!-- Optical Glass Card -->
  <rect x="48" y="48" width="1104" height="534" rx="28" fill="url(#glassSurface)" stroke="url(#snellRim)" stroke-width="1.5" />
  <line x1="96" y1="49" x2="1104" y2="49" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1" />

  <!-- NUKRON Emblem -->
  <g transform="translate(100, 96)">
    <rect width="68" height="68" rx="18" fill="#0D1426" stroke="url(#nukronGrad)" stroke-width="2" />
    <rect x="18" y="16" width="13" height="36" rx="3" fill="#3B82F6" />
    <rect x="37" y="16" width="13" height="36" rx="3" fill="#2563EB" />
    <path d="M22 16H31L37 30L46 52H37L31 38L22 16Z" fill="#E63946" />
  </g>
  <text x="186" y="141" fill="#F8FAFC" font-family="Unbounded, Segoe UI, sans-serif" font-size="30" font-weight="800" letter-spacing="4">NUKRON</text>

  <!-- Headline & Tagline -->
  <text x="100" y="270" fill="#F8FAFC" font-family="Unbounded, Segoe UI, sans-serif" font-size="56" font-weight="800">Your games.</text>
  <text x="100" y="344" fill="url(#nukronGrad)" font-family="Unbounded, Segoe UI, sans-serif" font-size="56" font-weight="800">Your universe.</text>

  <text x="100" y="414" fill="#AAB6CC" font-family="Inter, Segoe UI, sans-serif" font-size="23">Precision optical-glass PC game launcher for Windows. Unified local library,</text>
  <text x="100" y="448" fill="#AAB6CC" font-family="Inter, Segoe UI, sans-serif" font-size="23">4-second SQLite playtime tracking, and a real-time hardware performance HUD.</text>

  <!-- Action Pill & Specs -->
  <rect x="100" y="490" width="240" height="48" rx="24" fill="url(#bluePrimary)" />
  <text x="220" y="520" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">NUKRON for Windows</text>
  <text x="368" y="520" fill="#AAB6CC" font-family="Inter, Segoe UI, sans-serif" font-size="17">Windows 10 &amp; 11 · Local SQLite · Zero Cloud Bloat</text>
</svg>
