name: Deploy Official NUKRON Website

on:
  push:
    branches:
      - main
    paths:
      - 'apps/website/**'
      - 'packages/shared/**'
      - 'assets/**'
      - 'renderer/changelog.js'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'ember-website-pages'
  cancel-in-progress: true

jobs:
  build-website:
    name: Build Static Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build website (independent from desktop Electron build)
        run: npm run build:website

      - name: Run website verification tests
        run: npm run test:website

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy-website:
    name: Deploy to GitHub Pages
    needs: build-website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

