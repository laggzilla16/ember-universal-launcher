    <rect x="412" y="84" width="184" height="74" rx="12" fill="#090D19" fill-opacity="0.72" stroke="#E63946" stroke-opacity="0.38"/>
    <text x="428" y="110" fill="#FDA4AF" font-family="Unbounded, sans-serif" font-size="12" font-weight="700">Snell's Law HUD</text>
